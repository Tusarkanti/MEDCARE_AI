<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explainable Disease Prediction - MedCare AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <h1>🔬 Explainable Multi-Disease Prediction</h1>
        <p>Select symptoms and get prediction with explanations, precautions, medicines, and risk factors</p>
        
        <div class="input-section">
            <h3>Select Symptoms</h3>
            <div id="symptoms-list" class="symptoms-grid"></div>
            <button id="predict-btn" class="predict-btn">Predict Disease</button>
        </div>
        
        <div id="results-section" class="results-section" style="display:none;">
            <h2>Prediction Results</h2>
            <div class="main-result">
                <h3 id="disease-name"></h3>
                <div class="confidence" id="confidence"></div>
                <div class="risk-level" id="risk-level"></div>
            </div>
            
            <div class="explanation-section">
                <h3>Why this prediction? (SHAP Analysis)</h3>
                <canvas id="shap-chart"></canvas>
                <p id="explanation-text"></p>
            </div>
            
            <div class="recommendations">
                <div class="precautions">
                    <h4>🛡️ Precautions</h4>
                    <ul id="precautions-list"></ul>
                </div>
                <div class="risks">
                    <h4>⚠️ Risk Factors</h4>
                    <ul id="risks-list"></ul>
                </div>
                <div class="medicines">
                    <h4>💊 Suggested Medicines</h4>
                    <ul id="medicines-list"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000';
        
        async function loadSymptoms() {
            const response = await fetch(`${API_URL}/api/predict/health`);
            const data = await response.json();
            return data.symptoms || ['fever', 'cough', 'headache', 'fatigue'];  // fallback
        }
        
        async function predictSymptoms(symptoms) {
            const response = await fetch(`${API_URL}/api/predict`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({symptoms})
            });
            return await response.json();
        }
        
        async function init() {
            const symptoms = await loadSymptoms();
            const grid = document.getElementById('symptoms-list');
            symptoms.forEach(symptom => {
                const div = document.createElement('div');
                div.className = 'symptom-item';
                div.innerHTML = `
                    <label>
                        <input type="checkbox" value="${symptom}">
                        ${symptom.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase())}
                    </label>
                `;
                grid.appendChild(div);
            });
            
            document.getElementById('predict-btn').onclick = handlePredict;
        }
        
        async function handlePredict() {
            const checkboxes = document.querySelectorAll('#symptoms-list input:checked');
            const symptoms = Array.from(checkboxes).map(cb => cb.value);
            
            if (symptoms.length === 0) {
                alert('Please select at least one symptom');
                return;
            }
            
            document.getElementById('predict-btn').textContent = 'Analyzing...';
            
            try {
                const result = await predictSymptoms(symptoms);
                if (result.success) {
                    displayResults(result);
                } else {
                    alert('Prediction failed: ' + result.error);
                }
            } catch (error) {
                alert('Server error: ' + error.message);
            } finally {
                document.getElementById('predict-btn').textContent = 'Predict Disease';
                document.getElementById('results-section').style.display = 'block';
            }
        }
        
        function displayResults(result) {
            document.getElementById('disease-name').textContent = result.predicted_disease;
            document.getElementById('confidence').innerHTML = `Confidence: <strong>${result.confidence}%</strong>`;
            document.getElementById('risk-level').textContent = `Risk Level: ${result.risk_level}`;
            document.getElementById('explanation-text').textContent = result.explanation;
            
            // SHAP Chart
            const ctx = document.getElementById('shap-chart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: result.top_symptoms_influencing.map(s => s[0]),
                    datasets: [{
                        label: 'SHAP Importance',
                        data: result.top_symptoms_influencing.map(s => Math.abs(s[1])),
                        backgroundColor: result.top_symptoms_influencing.map(s => s[1] > 0 ? '#e74c3c' : '#3498db')
                    }]
                },
                options: {
                    indexAxis: 'y',
                    scales: {
                        x: { beginAtZero: true }
                    }
                }
            });
            
            // Recommendations
            const precList = document.getElementById('precautions-list');
            precList.innerHTML = result.precautions.map(p => `<li>${p}</li>`).join('');
            
            const riskList = document.getElementById('risks-list');
            riskList.innerHTML = result.risk_factors.map(r => `<li>${r}</li>`).join('');
            
            const medList = document.getElementById('medicines-list');
            medList.innerHTML = result.medicines.map(m => `<li><strong>${m.name}</strong>: ${m.desc}</li>`).join('');
        }
        
        init();
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #0f0f23; color: white; }
        .container { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; }
        .symptoms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 20px 0; }
        .symptom-item label { display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; }
        .predict-btn { background: linear-gradient(45deg, #e74c3c, #c0392b); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .results-section { margin-top: 30px; }
        .main-result { text-align: center; padding: 30px; background: rgba(255,255,255,0.1); border-radius: 20px; margin-bottom: 30px; }
        .confidence { font-size: 24px; margin: 10px 0; }
        .risk-level { font-size: 20px; padding: 10px 20px; border-radius: 25px; display: inline-block; }
        .risk-level.High { background: #e74c3c; }
        .risk-level.Medium { background: #f39c12; }
        .risk-level.Low { background: #27ae60; }
        .recommendations { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .precautions, .risks, .medicines { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        canvas { max-height: 300px; }
    </style>
</body>
</html>
